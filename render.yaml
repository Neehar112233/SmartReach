# SmartReach AI — Render Blueprint
# Deploy: https://render.com/deploy

services:
  - type: web
    name: smartreach-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: smartreach
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SYSTEM_SMTP_HOST
        value: "smtp.gmail.com"
      - key: SYSTEM_SMTP_PORT
        value: "587"
      - key: SYSTEM_SMTP_USER
        sync: false
      - key: SYSTEM_SMTP_PASSWORD
        sync: false
      - key: SYSTEM_SMTP_SENDER_EMAIL
        sync: false
      - key: SYSTEM_SMTP_SENDER_NAME
        value: "SmartReach AI"
      - key: RESEND_API_KEY
        sync: false
    healthCheckPath: /api/health


